name: Build Windows EXE

# Spustí se automaticky, když vytvoříš nový "Release" na GitHubu (viz návod).
# Volitelně jde spustit i ručně přes záložku "Actions" -> "Run workflow".
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Stáhnout kód repozitáře
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Nainstalovat závislosti
        run: |
          pip install pynput pyinstaller

      - name: Sestavit .exe
        run: |
          pyinstaller --onefile --windowed --name AutoClicker autoclicker.py

      - name: Nahrát .exe jako přílohu k tomuto Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoClicker.exe

      - name: Nahrát .exe jako build artifact (i bez Release)
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-windows
          path: dist/AutoClicker.exe
